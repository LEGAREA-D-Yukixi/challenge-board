<title>L-1グランプリ | Division対抗ポイントバトル</title>
<style>
  :root {
    --navy0:#03060f; --navy1:#071231; --navy2:#0c1c46; --panel:#0a1838; --panel2:#0f2452;
    --line:#1f5ec0; --line-soft:#173a7e;
    --cyan:#35c8ff; --cyan-soft:#8fe6ff; --gold:#ffc627; --gold-soft:#ffe27a;
    --text:#eaf2ff; --muted:#9fb4dd;
    --add:#3ce38c; --deduct:#ff556e; --danger:#ffe000;
    --g-gold:linear-gradient(150deg,#fff6d6 0%,#ffd75e 34%,#e6a913 68%,#9c6f0c 100%);
    --g-silver:linear-gradient(150deg,#ffffff 0%,#dbe3ee 32%,#9fadc2 66%,#69748a 100%);
    --g-bronze:linear-gradient(150deg,#ffe0c2 0%,#e6a877 32%,#b9743e 66%,#7c4a24 100%);
  }
  * { box-sizing:border-box; }
  html,body { margin:0; }
  body {
    font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif; color:var(--text);
    background:var(--navy0); min-height:100vh;
  }
  /* ===== ポスター調 背景（濃紺＋回路＋グロー・全面適用） ===== */
  body::before {
    content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(1200px 560px at 50% -80px, rgba(60,205,255,.34), transparent 60%),
      radial-gradient(820px 600px at 8% 14%, rgba(38,110,215,.40), transparent 56%),
      radial-gradient(820px 600px at 92% 24%, rgba(28,84,180,.38), transparent 56%),
      radial-gradient(760px 640px at 50% 110%, rgba(24,74,165,.40), transparent 58%),
      linear-gradient(180deg, #0c1c46 0%, #0a1738 40%, #06102a 74%, #03060f 100%);
  }
  /* スパークル（星）レイヤー */
  .bgfx { position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.9; }
  .bgfx b {
    position:absolute; width:2px; height:2px; border-radius:50%; background:#dff3ff;
    box-shadow:0 0 6px 2px rgba(150,225,255,.9), 0 0 12px 4px rgba(90,180,255,.4);
    animation:tw 3.4s ease-in-out infinite;
  }
  .bgfx b:nth-child(1){left:12%;top:10%} .bgfx b:nth-child(2){left:83%;top:8%;width:3px;height:3px;animation-delay:.6s}
  .bgfx b:nth-child(3){left:47%;top:5%;animation-delay:1.1s} .bgfx b:nth-child(4){left:24%;top:22%;animation-delay:.3s}
  .bgfx b:nth-child(5){left:68%;top:18%;animation-delay:1.6s} .bgfx b:nth-child(6){left:91%;top:33%;animation-delay:.9s}
  .bgfx b:nth-child(7){left:6%;top:38%;animation-delay:2s} .bgfx b:nth-child(8){left:55%;top:30%;width:3px;height:3px;animation-delay:1.4s}
  /* 流れ星（JSでランダム生成） */
  .shooting-layer { position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
  .shooting { position:absolute; height:2px; width:140px; border-radius:2px; opacity:0;
    background:linear-gradient(90deg, rgba(191,233,255,0) 0%, rgba(191,233,255,.35) 60%, #ffffff 100%);
    box-shadow:0 0 8px 1px rgba(150,225,255,.75); transform-origin:left center; }
  .shooting::after { content:""; position:absolute; right:-3px; top:-2px; width:6px; height:6px; border-radius:50%;
    background:#fff; box-shadow:0 0 10px 3px rgba(180,235,255,.95); }
  /* 巨大隕石（1000分の1で出現・地獄の炎玉／画面の約1/3） */
  .meteor { position:absolute; opacity:0; transform-origin:left center; pointer-events:none; will-change:transform,opacity; }
  .meteor .met-tail { position:absolute; left:0; top:50%; transform:translateY(-50%); border-radius:50%;
    background:linear-gradient(90deg, rgba(255,60,0,0) 0%, rgba(190,25,0,.30) 26%, rgba(255,85,10,.55) 58%, rgba(255,175,70,.9) 100%);
    filter:blur(8px); animation:met-wobble .5s ease-in-out infinite alternate; }
  .meteor .met-orb { position:absolute; right:0; top:0; border-radius:50%;
    background:radial-gradient(circle at 42% 38%, #fff7e0 0%, #ffe37a 9%, #ffb020 22%, #ff5a00 40%, #e02200 58%, #7a0f00 80%, #240400 100%);
    box-shadow:0 0 60px 18px rgba(255,120,30,.8), 0 0 160px 60px rgba(255,50,0,.55), 0 0 300px 140px rgba(150,15,0,.42);
    animation:met-pulse .9s ease-in-out infinite alternate; }
  .meteor .met-core { position:absolute; left:29%; top:25%; width:44%; height:44%; border-radius:50%;
    background:radial-gradient(circle, #fffef7 0%, #ffe9a8 46%, rgba(255,190,70,0) 74%);
    mix-blend-mode:screen; animation:met-flicker .13s steps(2) infinite; }
  @keyframes met-pulse { from{ filter:brightness(1) } to{ filter:brightness(1.2) } }
  @keyframes met-flicker { 0%{ opacity:.85; transform:scale(1) } 50%{ opacity:1; transform:scale(1.09) } 100%{ opacity:.9; transform:scale(.96) } }
  @keyframes met-wobble { from{ transform:translateY(-56%) scaleY(.88) } to{ transform:translateY(-44%) scaleY(1.14) } }
  .wrap { max-width:1080px; margin:0 auto; padding:16px 24px 84px; position:relative; z-index:1; }
  .admin-link { position:absolute; top:14px; right:16px; z-index:5; background:linear-gradient(90deg,var(--cyan),#1b8fd6); color:#06122e; font-weight:900; font-size:13px; padding:8px 14px; border-radius:10px; text-decoration:none; box-shadow:0 0 16px rgba(53,200,255,.45); }
  .admin-link:hover { filter:brightness(1.08); }

  /* ===== ヘッダー ===== */
  header { text-align:center; padding:10px 0 4px; }
  .kicker { color:var(--cyan-soft); letter-spacing:.14em; font-weight:800; font-size:14px; text-shadow:0 0 10px rgba(53,200,255,.5); }
  .logorow { display:flex; align-items:center; justify-content:center; gap:6px; margin:2px 0; }
  .logo {
    font-size:clamp(36px,9.5vw,62px); font-weight:900; line-height:1; font-style:italic; letter-spacing:.01em;
    background:linear-gradient(180deg,#fff 6%,var(--gold-soft) 42%,var(--gold) 76%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 3px 10px rgba(255,198,39,.5)) drop-shadow(0 0 2px rgba(0,0,0,.7));
  }
  .logo-trophy { height:clamp(52px,13vw,86px); filter:drop-shadow(0 4px 14px rgba(255,198,39,.55)); margin:0 -2px; }
  .tagline {
    display:inline-block; margin-top:6px; padding:6px 20px; font-weight:800; font-size:14px; color:#06122e;
    background:linear-gradient(90deg,var(--cyan),var(--cyan-soft)); border-radius:4px;
    clip-path:polygon(7px 0,100% 0,calc(100% - 7px) 100%,0 100%); box-shadow:0 0 16px rgba(53,200,255,.4);
  }

  /* ===== 見出し（▶▶ … ◀◀） ===== */
  .banner { display:flex; align-items:center; justify-content:center; gap:12px; margin:16px 0 12px;
            font-weight:900; font-size:clamp(20px,4.8vw,26px); text-shadow:0 0 12px rgba(53,200,255,.55); }
  .banner .tri { color:var(--cyan); letter-spacing:-2px; font-size:17px; }
  .season-countdown { text-align:center; margin:0 auto 14px; padding:12px 18px; max-width:520px;
    background:linear-gradient(180deg,rgba(255,180,70,.18),rgba(255,120,60,.10)); border:1px solid rgba(255,190,120,.55);
    border-radius:12px; color:#ffe6c2; font-weight:800; font-size:17px; box-shadow:0 0 18px rgba(255,170,90,.25); }
  .season-countdown b { color:#fff; font-size:20px; }
  .season-countdown .cd-sub { display:block; color:var(--muted); font-weight:600; font-size:12px; margin-top:3px; }

  .tabs { display:flex; gap:8px; margin:4px 0; flex-wrap:wrap; justify-content:center; }
  .tabs button { background:rgba(10,24,56,.75); color:var(--cyan-soft); border:1px solid var(--line-soft);
                 border-radius:8px; padding:11px 18px; cursor:pointer; font-size:16px; font-weight:800; transition:.15s; }
  .tabs button:hover { border-color:var(--cyan); }
  .tabs button.active { background:linear-gradient(90deg,var(--cyan),#1b8fd6); color:#06122e; border-color:var(--cyan); box-shadow:0 0 16px rgba(53,200,255,.4); }

  .card { background:linear-gradient(180deg,rgba(12,28,66,.94),rgba(8,20,48,.94)); border:1px solid var(--line);
          border-radius:14px; padding:16px; margin-bottom:16px; box-shadow:inset 0 0 0 1px rgba(53,200,255,.06),0 8px 30px rgba(0,0,0,.4); }
  .card h2 { font-size:15px; margin:0 0 12px; color:var(--cyan-soft); }

  select,input,textarea { width:100%; background:#061031; color:var(--text); border:1px solid var(--line-soft);
                          border-radius:8px; padding:10px 11px; font-size:14px; }
  select:focus,input:focus,textarea:focus { outline:none; border-color:var(--cyan); box-shadow:0 0 0 3px rgba(53,200,255,.18); }
  label { display:block; font-size:12px; color:var(--muted); margin:10px 0 4px; }
  .btn { background:linear-gradient(90deg,var(--gold),var(--gold-soft)); color:#2a1c00; border:none; border-radius:8px;
         padding:11px 20px; font-size:14px; font-weight:800; cursor:pointer; box-shadow:0 4px 16px rgba(255,198,39,.3); margin-top:14px; }
  .btn:disabled { opacity:.5; cursor:default; }

  /* ===== 順位（案3: 3D深度 逆ピラミッド） ===== */
  @keyframes tw{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.25)}}
  @keyframes champGlow{0%,100%{box-shadow:0 0 24px rgba(255,198,39,.4),inset 0 2px 0 rgba(255,225,150,.35),inset 0 -6px 14px rgba(0,0,0,.4)}50%{box-shadow:0 0 44px rgba(255,198,39,.72),inset 0 2px 0 rgba(255,225,150,.5),inset 0 -6px 14px rgba(0,0,0,.4)}}
  @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

  .medallion .mnum { position:relative; z-index:1; font-style:italic; font-weight:900; text-shadow:0 1px 1px rgba(255,255,255,.55), 0 -1px 2px rgba(0,0,0,.4); transform:translateX(-0.04em); }
  .m-gold{background:var(--g-gold)} .m-silver{background:var(--g-silver)} .m-bronze{background:var(--g-bronze)}
  .m-blue{background:linear-gradient(150deg,#8fd0ff,#2f7fd0,#173a7e);color:#eaf6ff;text-shadow:0 1px 2px rgba(0,0,0,.5)}
  .m-danger{background:linear-gradient(150deg,#ff8a8a,#e0263a,#7e1420);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5)}
  .prow { position:relative; margin:0 auto; width:100%; display:grid; grid-template-columns:68px 1fr; align-items:center; gap:12px;
    border-radius:16px; padding:10px 16px; color:var(--text); transition:width .25s ease;
    background:linear-gradient(180deg,rgba(30,58,124,.96),rgba(10,24,60,.98)); border:1px solid rgba(90,160,255,.35);
    box-shadow:0 10px 24px rgba(0,0,0,.42),inset 0 2px 0 rgba(150,205,255,.35),inset 0 -6px 14px rgba(0,0,0,.4); }
  .prow > .medallion:not(.mlarge) { justify-self:center; }
  .pinfo { min-width:0; }
  .pinfo-top { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .prow .nm { font-weight:800; font-size:17px; display:flex; align-items:center; flex-wrap:wrap; min-width:0; overflow-wrap:anywhere; }
  .prow .val { text-align:right; white-space:nowrap; flex:0 0 auto; }
  .prow .val .pt { font-weight:900; font-size:20px; }

  /* ミニ基準線ゲージ: 左端0・中央1,000（数字なし・カード全幅で全行揃う） */
  .mini { position:relative; height:12px; background:rgba(2,8,24,.85); border-radius:8px; overflow:hidden; border:1px solid var(--line-soft); margin-top:6px; width:100%; }
  .mini .f { position:absolute; left:0; top:0; bottom:0; border-radius:8px 0 0 8px; }
  .mini .f.up { background:linear-gradient(90deg,rgba(56,224,138,.5),var(--add)); }
  .mini .f.down { background:linear-gradient(90deg,rgba(255,85,110,.5),var(--deduct)); }
  .mini .f.champ { background:var(--g-gold); }
  .mini .c { position:absolute; left:50%; top:-2px; bottom:-2px; width:2px; background:rgba(255,255,255,.65); }

  /* 1位 = 王者（金オーラ＋トロフィー） */
  .prow.champ { background:linear-gradient(180deg,rgba(92,66,14,.7),rgba(30,24,8,.92)); border:2px solid var(--gold); animation:champGlow 2.8s ease-in-out infinite; }
  .prow.champ .nm { font-size:19px; color:var(--gold-soft); text-shadow:0 0 14px rgba(255,198,39,.5); }
  .prow.champ .val .pt { font-size:23px; color:var(--gold-soft); }
  .prow .c-tro { position:absolute; right:16px; top:-16px; height:48px; filter:drop-shadow(0 6px 14px rgba(255,198,39,.6)); animation:floaty 4s ease-in-out infinite; }
  .champ-tag { display:inline-block; font-size:12px; font-weight:900; color:#2a1c00; background:var(--g-gold); padding:2px 10px; border-radius:11px; margin-left:8px; }

  /* 最下位 = 危険（ハザードテープ） */
  .prow.last { border:2px solid var(--danger); background:linear-gradient(180deg,rgba(80,14,26,.85),rgba(40,8,16,.95)); }
  .prow.last .nm { color:#ffc0cc; }
  .prow.last::after { content:""; position:absolute; left:0; right:0; bottom:0; height:6px; border-radius:0 0 14px 14px;
    background:repeating-linear-gradient(45deg,#ffe000 0 12px,#1a1a1a 12px 24px); }
  .last-tag { display:inline-block; font-size:12px; font-weight:900; color:#2a0008; background:var(--danger); padding:2px 10px; border-radius:11px; margin-left:8px; }
  .last-note { text-align:center; color:var(--danger); font-size:12px; font-weight:700; margin-top:6px; }
  .gappos{color:var(--add)} .gapneg{color:var(--deduct)}

  /* ===== 判定基準（ポスター準拠テーブル） ===== */
  .critwrap { display:grid; gap:16px; }
  .crittbl { border-radius:12px; overflow:hidden; border:1px solid var(--line-soft); background:linear-gradient(180deg,#0e2350,#0a1836); box-shadow:0 8px 22px rgba(0,0,0,.4); }
  .crittbl.deduct { border-color:rgba(53,200,255,.5); }
  .crittbl.add { border-color:rgba(255,110,180,.5); }
  .crithead { display:flex; align-items:center; gap:10px; padding:12px 16px; font-weight:900; font-size:18px; }
  .crittbl.deduct .crithead { background:linear-gradient(90deg,rgba(53,200,255,.28),transparent); color:var(--cyan-soft); }
  .crittbl.add .crithead { background:linear-gradient(90deg,rgba(255,110,180,.28),transparent); color:#ff9ecb; }
  .critrow { display:grid; grid-template-columns:52px 1fr auto; align-items:center; gap:12px; padding:13px 16px; border-top:1px solid rgba(53,200,255,.12); font-size:16px; }
  .critrow .ci { width:36px; height:36px; object-fit:contain; border-radius:6px; background:#0a1c40; border:1px solid rgba(53,200,255,.22); padding:2px; box-sizing:border-box; }
  .critrow .clabel { font-weight:800; font-size:17px; }
  .critrow .cdesc { color:var(--muted); font-size:14px; margin-top:2px; }
  .critrow .cpt { font-weight:900; white-space:nowrap; font-size:18px; }
  .critrow .cpt.add { color:var(--add); }
  .critrow .cpt.deduct { color:var(--deduct); }

  /* ===== ポイント増減履歴 ===== */
  .feedbar { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .feedbar label { margin:0; font-weight:800; color:var(--cyan-soft); }
  .feedbar select { max-width:320px; }
  .feeditem { display:flex; justify-content:space-between; gap:12px; padding:13px 4px; border-bottom:1px solid var(--line-soft); font-size:17px; align-items:center; }
  .feeditem:last-child { border-bottom:none; }
  .feeditem .left { min-width:0; display:flex; align-items:center; gap:12px; }
  .feeditem .fi { width:40px; height:40px; object-fit:contain; flex:0 0 auto; display:block; }
  .feeditem .ftext { min-width:0; }
  .feeditem .date { color:var(--muted); margin-right:8px; font-variant-numeric:tabular-nums; }
  .feeditem .fpt { font-weight:900; font-size:18px; white-space:nowrap; }
  .pager { display:flex; align-items:center; justify-content:center; gap:8px; margin-top:16px; flex-wrap:wrap; }
  .pager .pgnum, .pager .pgnav {
    min-width:38px; height:38px; padding:0 10px; display:inline-flex; align-items:center; justify-content:center;
    background:rgba(10,24,56,.9); color:var(--cyan-soft); border:1px solid var(--line-soft); border-radius:9px;
    font-weight:800; font-size:15px; cursor:pointer; transition:.15s; }
  .pager .pgnum:hover:not(.active), .pager .pgnav:hover:not(:disabled) { border-color:var(--cyan); color:#eaf6ff; }
  .pager .pgnum.active { background:linear-gradient(180deg,var(--cyan),#1b8fd6); color:#06122e; border-color:var(--cyan); box-shadow:0 0 14px rgba(53,200,255,.45); cursor:default; }
  .pager .pgnav:disabled { opacity:.35; cursor:default; }
  .pager .pgellipsis { color:var(--muted); padding:0 4px; font-weight:800; }
  .add { color:var(--add); font-weight:800; }
  .deduct { color:var(--deduct); font-weight:800; }
  .muted { color:var(--muted); font-size:12px; }

  .blackout { text-align:center; padding:30px 12px; }
  .blackout .big { font-size:21px; font-weight:900; margin-bottom:8px; color:var(--gold-soft); text-shadow:0 0 16px rgba(255,198,39,.4); }
  .blackout p { color:var(--muted); font-size:14px; margin:4px 0; }

  .msg { border-radius:8px; padding:11px 13px; font-size:13px; margin-top:12px; display:none; }
  .msg.okmsg { background:rgba(56,224,138,.12); color:var(--add); display:block; border:1px solid rgba(56,224,138,.3); }
  .msg.ngmsg { background:rgba(255,85,110,.12); color:var(--deduct); display:block; white-space:pre-wrap; border:1px solid rgba(255,85,110,.3); }
  .hidden { display:none !important; }
  #loading { color:var(--muted); padding:26px; text-align:center; }

import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
import { SUPABASE_URL, SUPABASE_ANON_KEY } from './config.js';
import {
  isBlackout, isAnnualBlackout, seasonForDate, calcStandingsCarry, calcAnnualStandings,
  validateRequestInput, groupRules, buildFeed, formatPoints, seasonBaseline, pointsBar, pyramidWidth, annualTermLabel, rankGaps, leadOverSecond,
  fiscalTerm, isSecondHalf, seasonCountdown,
  filterNameItems, eventsForSeasons, seasonIdsForCycle, podiumFlags,
} from './l1-core.js';
import { ICON_DATA, TROPHY, DEFAULT_ICON } from './l1-icons.js';

const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);
const todayISO = () => new Date().toLocaleDateString('sv-SE');
const EVENT_COLS = 'id, season_id, division_id, rule_id, points, occurred_on, request_id, created_at, voided_at';

// 判定基準カテゴリ → ポスター切り出しアイコン（base64埋め込み・ルール厳守/遵守を吸収）
const iconFor = cat => ICON_DATA[cat] || (cat === 'ルール厳守' ? ICON_DATA['ルール遵守'] : null);
function iconImg(cat, cls) {
  const d = iconFor(cat);
  return d ? `<img class="${cls}" src="${d}" alt="">` : '';
}

let state = { divisions: [], seasons: [], rules: [], events: [], selectedSeasonId: null, feedSeasonId: null, feedPage: 0 };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

// 氏名セレクトにリアルタイム検索を付ける（1文字入力ごとに候補を更新）
function attachSearchSelect(sel, getItems, opts = {}) {
  if (!sel) return null;
  const prev = sel.previousElementSibling;
  let box;
  if (prev && prev.dataset && prev.dataset.nsearch === '1') {
    box = prev;
  } else {
    box = document.createElement('input');
    box.type = 'search';
    box.dataset.nsearch = '1';
    box.autocomplete = 'off';
    box.placeholder = opts.placeholder || '氏名で検索';
    box.style.marginBottom = '6px';
    sel.parentNode.insertBefore(box, sel);
  }
  const emptyLabel = opts.emptyLabel ?? '選択してください';
  const render = () => {
    const hits = filterNameItems(getItems(), box.value);
    const want = sel.value || '';
    const head = hits.length
      ? `<option value="">${esc(emptyLabel)}</option>`
      : `<option value="">${esc(box.value ? '該当する氏名がありません' : emptyLabel)}</option>`;
    sel.innerHTML = head + hits.map(it => `<option value="${esc(it.value)}">${esc(it.label)}</option>`).join('');
    if (want && hits.some(it => String(it.value) === String(want))) sel.value = want;
  };
  box.oninput = render;   // 1文字ごとにリアルタイム更新
  render();
  return render;
}
function showErr(msg) { const b=$('errBox'); b.className='msg ngmsg'; b.textContent=msg; }

async function loadAll() {
  const [dv, ss, rl, ev] = await Promise.all([
    sb.from('l1_divisions').select('*').order('display_order'),
    sb.from('l1_seasons').select('*').order('starts_on'),
    sb.from('l1_rules').select('*').order('display_order'),
    sb.from('l1_events').select(EVENT_COLS).order('occurred_on', { ascending:false }).limit(2000),
  ]);
  for (const r of [dv, ss, rl, ev]) if (r.error) throw r.error;
  state.divisions=dv.data; state.seasons=ss.data; state.rules=rl.data; state.events=ev.data;
  const active = state.seasons.find(s => s.is_active) || seasonForDate(state.seasons, todayISO());
  state.selectedSeasonId = active ? active.id : (state.seasons.at(-1)?.id ?? null);
}

function renderPyramid(container, rows, baseline) {
  const total = rows.length;
  const maxRank = rows.length ? Math.max(...rows.map(r => r.rank)) : 0;
  container.innerHTML = '<div id="podium"></div>';
  const podium = container.querySelector('#podium');
  rows.forEach((r, i) => {
    // 全Divisionが同率1位のときは最下位を作らず、全員を1位扱いにする
    const { isChamp, isLast } = podiumFlags({ rank: r.rank, maxRank, total });
    const width = pyramidWidth(r.rank, total);
    const bar = pointsBar({ points:r.points, baseline });
    // メダル色は「順位」で決定（同順位は同じ色）。最下位は危険色。
    const mcls = isLast ? 'm-danger'
      : r.rank === 1 ? 'm-gold'
      : r.rank === 2 ? 'm-silver'
      : r.rank === 3 ? 'm-bronze'
      : 'm-blue';
    const big = (isChamp || isLast) ? ' mlarge' : '';
    const deco = isLast ? '' : (r.rank === 1 ? ' deco-laurel' : r.rank === 2 ? ' deco-stars' : r.rank === 3 ? ' deco-diamond' : '');
    const badge = isChamp ? crownSVG() : (isLast ? skullSVG() : `<span class="mnum">${r.rank}</span>`);
    const fillCls = isChamp ? 'champ' : (bar.side === 'down' ? 'down' : 'up');
    const el = document.createElement('div');
    el.className = 'prow' + (isChamp ? ' champ' : '') + (isLast ? ' last' : '');
    el.style.width = width + '%';   // 逆ピラミッド幅（1位=最大, 最下位=最小）。#podiumで中央寄せ＝基準線は縦に揃う
    el.innerHTML = `
      ${isChamp ? `<img class="c-tro" src="${TROPHY}" alt="">` : ''}
      <div class="medallion ${mcls}${big}${deco}">${badge}</div>
      <div class="pinfo">
        <div class="pinfo-top">
          <div class="nm">${esc(r.name)}${isLast ? '<span class="last-tag">最下位</span>' : ''}</div>
          <div class="val"><div class="pt">${r.points.toLocaleString()}<span style="font-size:14px"> L</span></div></div>
        </div>
        <div class="mini"><div class="f ${fillCls}" style="width:${bar.fillPct}%"></div><div class="c" style="left:${bar.centerPct}%"></div></div>
      </div>`;
    podium.appendChild(el);
  });
}

function renderStandings() {
  const season = state.seasons.find(s => s.is_active)
    || state.seasons.find(s => s.id === state.selectedSeasonId)
    || state.seasons.at(-1);
  if (!season) { $('standingsBody').innerHTML = '<div class="card muted">シーズンがありません</div>'; return; }
  state.selectedSeasonId = season.id;
  const eventsBySeason = new Map(state.seasons.map(s => [s.id, state.events.filter(e => e.season_id === s.id)]));
  const rows = calcStandingsCarry({ season, seasons:state.seasons, divisions:state.divisions.filter(d=>d.is_active!==false&&d.in_ranking!==false), eventsBySeason });
  const baseline = seasonBaseline({ season, seasons:state.seasons });
  const blackout = isBlackout(season, todayISO());
  const term = fiscalTerm(todayISO());
  $('standingsTitle').textContent = term.label || season.name;

  // シーズン開始前月(8月/2月)は結果発表までのカウントダウン
  const cd = seasonCountdown(todayISO());
  const cdEl = $('seasonCountdown');
  if (cdEl) {
    if (cd.active) { cdEl.classList.remove('hidden'); cdEl.innerHTML = `🏁 結果発表まで <b>あと${cd.days}日</b><span class="cd-sub">（${cd.targetLabel}に次シーズン開始）</span>`; }
    else cdEl.classList.add('hidden');
  }

  if (blackout) {
    $('standingsBody').innerHTML = `
      <div class="card blackout">
        <div class="big">🤫 順位は決起会で発表！</div>
        <p>結果発表月のため、順位と現在ポイントは非公開です。</p>
        <p>今期のポイント増減は下の履歴で確認できます。</p>
      </div>`;
  } else {
    renderPyramid($('standingsBody'), rows, baseline);
    requestAnimationFrame(() => fitPodium($('standingsBody')));
  }
  // 履歴は表示中シーズンが属する期(cycle)のみ（前期の記録は表示しない）
  renderFeed('feed', eventsForSeasons(state.events, seasonIdsForCycle(state.seasons, season.cycle)));
}

// 順位が多いときは、画面の高さに収まるよう順位全体を自動縮小（画面内に最下位まで表示）
function fitPodium(container) {
  const p = container && container.querySelector('#podium');
  if (!p) return;
  p.style.transform = '';
  p.style.marginBottom = '';
  const natural = p.offsetHeight;
  if (!natural) return;                                   // 非表示/空
  const topVp = p.getBoundingClientRect().top;
  const avail = window.innerHeight - topVp - 10;
  if (avail <= 0 || natural <= avail) return;             // すでに収まっている
  const scale = Math.max(0.45, avail / natural);
  p.style.transformOrigin = 'top center';
  p.style.transform = `scale(${scale})`;
  p.style.marginBottom = `-${Math.round(natural * (1 - scale))}px`;   // 縮小分だけ下の余白を詰める
}

// ポイント増減履歴（全期間を新しい順にページング）。順位/年間で共通表示・独立ページング
const FEED_PAGE_SIZE = 10;
const feedPageState = { feed: 0, annualFeed: 0 };
function feedPageList(cur, pages) {
  // 表示するページ番号（1始まり）。多い場合は … で省略。cur/pagesは1始まり
  if (pages <= 7) return Array.from({ length: pages }, (_, i) => i + 1);
  const set = new Set([1, 2, pages - 1, pages, cur - 1, cur, cur + 1]);
  const nums = [...set].filter(n => n >= 1 && n <= pages).sort((a, b) => a - b);
  const out = [];
  for (let i = 0; i < nums.length; i++) {
    if (i > 0 && nums[i] - nums[i - 1] > 1) out.push('…');
    out.push(nums[i]);
  }
  return out;
}
// 表示中のシーズン範囲のイベントをキー別に保持（ページャの再帰呼び出しでも範囲を維持する）
const feedEventsState = {};
function renderFeed(key = 'feed', events) {
  const bodyEl = $(key + 'Body'), pagerEl = $(key + 'Pager');
  if (!bodyEl) return;
  if (events !== undefined) feedEventsState[key] = events;
  const src = feedEventsState[key] || [];
  const feed = buildFeed({ events:src, divisions:state.divisions, rules:state.rules, limit:100000 });
  const pages = Math.max(1, Math.ceil(feed.length / FEED_PAGE_SIZE));
  feedPageState[key] = Math.min(Math.max(0, feedPageState[key] || 0), pages - 1);
  const page = feedPageState[key];
  const slice = feed.slice(page * FEED_PAGE_SIZE, (page + 1) * FEED_PAGE_SIZE);
  bodyEl.innerHTML = feed.length === 0
    ? '<div class="muted" style="padding:12px 0">今期のポイント記録はまだありません。</div>'
    : slice.map(f => `
      <div class="feeditem">
        <div class="left">${iconImg(f.category,'fi') || `<img class="fi" src="${DEFAULT_ICON}" alt="">`}<span class="ftext"><span class="date">${esc(f.occurred_on)}</span><b>${esc(f.division_name)}</b>　${esc(f.category)}<span class="muted">（${esc(f.label)}）</span></span></div>
        <div class="fpt ${f.kind === 'add' ? 'add' : 'deduct'}">${esc(f.points_label)} L</div>
      </div>`).join('');
  // 番号ページャ（中央下部）
  if (!pagerEl) return;
  if (pages <= 1) { pagerEl.innerHTML = ''; return; }
  const cur = page + 1;
  const items = feedPageList(cur, pages).map(n =>
    n === '…'
      ? '<span class="pgellipsis">…</span>'
      : `<button class="pgnum${n === cur ? ' active' : ''}" data-pg="${n}">${n}</button>`
  ).join('');
  pagerEl.innerHTML =
    `<button class="pgnav" data-pg="${cur - 1}" ${cur === 1 ? 'disabled' : ''} aria-label="前へ">‹</button>` +
    items +
    `<button class="pgnav" data-pg="${cur + 1}" ${cur === pages ? 'disabled' : ''} aria-label="次へ">›</button>`;
  pagerEl.querySelectorAll('[data-pg]').forEach(b => b.addEventListener('click', () => {
    const n = parseInt(b.dataset.pg, 10);
    if (!Number.isNaN(n) && n >= 1 && n <= pages) { feedPageState[key] = n - 1; renderFeed(key); }
  }));
}

function renderAnnual() {
  const active = state.seasons.find(s => s.is_active);
  const season = active || state.seasons.find(s => s.id === state.selectedSeasonId) || state.seasons.at(-1);
  const cycle = season?.cycle;
  if (!cycle) { $('annualBody').innerHTML = '<div class="card muted">データがありません</div>'; return; }
  const term = fiscalTerm(todayISO());
  $('annualTitle').textContent = `${term.termNo != null ? term.termNo + '期目 ' : ''}年間集計`;
  if (isAnnualBlackout({ cycle, seasons:state.seasons }, todayISO())) {
    $('annualBody').innerHTML = `
      <div class="card blackout">
        <div class="big">🤫 年間王者は決起会で発表！</div>
        <p>結果発表月のため、年間集計は非公開です。</p>
        <p>今期のポイント増減は下の履歴で確認できます。</p>
      </div>`;
    renderFeed('annualFeed', eventsForSeasons(state.events, seasonIdsForCycle(state.seasons, cycle)));
    return;
  }
  const eventsBySeason = new Map(state.seasons.map(s => [s.id, state.events.filter(e => e.season_id === s.id)]));
  const rows = calcAnnualStandings({ cycle, seasons:state.seasons, divisions:state.divisions.filter(d=>d.is_active!==false&&d.in_ranking!==false), eventsBySeason });
  const baseline = seasonBaseline({ season, seasons:state.seasons });
  renderPyramid($('annualBody'), rows, baseline);
  // 履歴は同一期（cycle）のみ（前期の記録は表示しない）
  renderFeed('annualFeed', eventsForSeasons(state.events, seasonIdsForCycle(state.seasons, cycle)));
}

async function submitRequest() {

  const reqName = (loginSession && loginSession.name) ? loginSession.name : $('apName').value;
  const input = { division_id:$('apDivision').value, requester_name:reqName, occurred_on:$('apDate').value, note:$('apNote').value, points:$('apPoints').value };
  const v = validateRequestInput(input, rule);
  const msg = $('apMsg');
  if (!v.ok) { msg.className='msg ngmsg'; msg.textContent=v.errors.join('\n'); return; }
  if (!loginSession || !loginSession.name) { msg.className='msg ngmsg'; msg.textContent='ログインが必要です。'; return; }
  $('apSubmit').disabled = true;
  const earner = ($('apEarnerSel') && !$('apEarnerSel').classList.contains('hidden'))
    ? $('apEarnerSel').value.trim()
    : $('apEarner').value.trim();
  const payload = { division_id:input.division_id, rule_id:rule.id, occurred_on:input.occurred_on, requester_name:input.requester_name.trim(), requester_email:null, earner_name:(earner || null), note:input.note || null };
  if (rule.is_variable) payload.points = v.points;
  const { error } = await sb.rpc('l1_submit_request', {
    p_division_id: payload.division_id,
    p_rule_id: payload.rule_id,
    p_occurred_on: payload.occurred_on,
    p_requester_name: payload.requester_name,
    p_requester_email: payload.requester_email,
    p_earner_name: payload.earner_name,
    p_note: payload.note,
    p_points: (payload.points ?? null)
  });
  $('apSubmit').disabled = false;
  if (error) { msg.className='msg ngmsg'; msg.textContent='申請に失敗しました: ' + error.message; return; }
  msg.className='msg okmsg'; msg.textContent='申請を受け付けました。運営の承認後にダッシュボードへ反映されます。';
  $('apNote').value=''; $('apPoints').value=''; $('apEarner').value=''; if ($('apEarnerSel')) $('apEarnerSel').value='';
}

async function dashAfterAuth() {

  try { const { data } = await sb.rpc('l1_my_member_must_reset'); mustReset = !!data; } catch { mustReset = false; }

// 都市スカイライン生成（ネオン・シンセウェーブ調をSVGで。参考画像の雰囲気＝暗いビル+ネオン輪郭+発光窓+ライトビーム+水面反射）
// （背景は指定画像をCSSで表示。SVG生成は廃止）
// ランダムに流れ星を流す（方向もランダム）
function spawnShootingStar() {
  const layer = $('shootingLayer');
  if (!layer) return;
  const star = document.createElement('div');
  star.className = 'shooting';
  const vw = window.innerWidth, vh = window.innerHeight;
  const startX = Math.random() * vw;
  const startY = Math.random() * vh * 0.7;
  const angle = Math.random() * 360;           // 全方位ランダム
  const dist = 460 + Math.random() * 640;
  star.style.left = startX + 'px';
  star.style.top = startY + 'px';
  layer.appendChild(star);
  star.animate([
    { transform: `rotate(${angle}deg) translateX(0)`, opacity: 0 },
    { opacity: 1, offset: 0.12 },
    { opacity: 1, offset: 0.82 },
    { transform: `rotate(${angle}deg) translateX(${dist}px)`, opacity: 0 },
  ], { duration: 650 + Math.random() * 650, easing: 'ease-in' }).onfinish = () => star.remove();
}
function spawnMeteor() {
  const layer = $('shootingLayer');
  if (!layer) return;
  const vw = window.innerWidth, vh = window.innerHeight;
  const head = Math.min(vw, vh) * 0.66;      // 炎玉の直径（画面の約2/3）
  const tail = head * 2.4;                    // 尾を引く炎
  const W = tail + head, H = head;

  const m = document.createElement('div');
  m.className = 'meteor';
  m.style.width = W + 'px';
  m.style.height = H + 'px';

  const tailEl = document.createElement('div');
  tailEl.className = 'met-tail';
  tailEl.style.width = (W - head * 0.42) + 'px';
  tailEl.style.height = (head * 0.36) + 'px';

  const orb = document.createElement('div');
  orb.className = 'met-orb';
  orb.style.width = head + 'px';
  orb.style.height = head + 'px';

  const core = document.createElement('div');
  core.className = 'met-core';
  orb.appendChild(core);
  m.appendChild(tailEl);
  m.appendChild(orb);

  const angle = 22 + Math.random() * 16;                 // 緩い下降 22〜38°
  const startX = -W + head * 0.2 + Math.random() * vw * 0.15;   // 炎玉が左上あたりから
  const startY = -head * 0.4 + Math.random() * vh * 0.12;
  const dist = (vw + vh) * (1.05 + Math.random() * 0.25);
  m.style.left = startX + 'px';
  m.style.top = startY + 'px';
  layer.appendChild(m);

  m.animate([
    { transform: `rotate(${angle}deg) translateX(0) scale(.9)`, opacity: 0 },
    { opacity: 1, offset: 0.12 },
    { opacity: 1, offset: 0.85 },
    { transform: `rotate(${angle}deg) translateX(${dist}px) scale(1.28)`, opacity: 0 },
  ], { duration: 7500 + Math.random() * 3000, easing: 'linear' }).onfinish = () => m.remove();  // ゆっくり(7.5〜10.5秒)
}
function scheduleShootingStar() {
  const prefersReduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (prefersReduced) return;
  if (Math.random() < 0.001) spawnMeteor();   // 1000分の1で巨大隕石
  else spawnShootingStar();
  setTimeout(scheduleShootingStar, 2600 + Math.random() * 4200); // ランダム間隔
}

    const { data: { user } } = await sb.auth.getUser();
    if (user) await dashAfterAuth();
  } catch (e) {
    showErr('初期化に失敗しました。\n' + (e?.message ?? e));
  }
}
init();
</script>
</body>
